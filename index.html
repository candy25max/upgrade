<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --yellow: #ffcc00;
            --text: #ffffff;
            --gray: #888888;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: var(--panel); border-bottom: 1px solid #333;
        }
        .balance { font-weight: bold; font-size: 18px; color: var(--yellow); }
        
        .upgrader-container {
            display: flex; flex-direction: column; align-items: center;
            margin-top: 30px; position: relative;
        }
        .wheel {
            width: 220px; height: 220px; border-radius: 50%;
            background: conic-gradient(#ffcc00 0deg, #ffcc00 108deg, #333 108deg, #333 360deg);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.2);
            transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .wheel-inner {
            width: 180px; height: 180px; border-radius: 50%;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .chance-text { font-size: 32px; font-weight: bold; color: var(--text); }
        .chance-label { font-size: 12px; color: var(--gray); text-transform: uppercase;}
        .needle {
            position: absolute; top: -10px; width: 0; height: 0;
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-top: 20px solid var(--yellow); z-index: 10;
        }

        .items-row {
            display: flex; justify-content: space-between; padding: 20px; gap: 10px;
            margin-top: 20px;
        }
        .item-box {
            background: var(--panel); border: 2px dashed #444; border-radius: 12px;
            width: 45%; height: 120px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
        }
        .item-box.active { border-color: var(--yellow); background: #2a2a2a; }
        
        .btn {
            background: var(--yellow); color: #000; font-weight: bold;
            font-size: 18px; padding: 15px; border: none; border-radius: 12px;
            margin: 20px; cursor: pointer; text-transform: uppercase;
        }
        .btn:disabled { opacity: 0.5; }
        
        /* Модальне вікно вибору подарунків */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: flex-end;
        }
        .modal-content {
            background: var(--panel); width: 100%; height: 60%; border-radius: 20px 20px 0 0;
            padding: 20px; box-sizing: border-box;
        }
        .gift-item {
            display: flex; justify-content: space-between; padding: 15px; 
            border-bottom: 1px solid #333; cursor: pointer;
        }
        .gift-item:active { background: #2a2a2a; }
    </style>
</head>
<body>
    <header>
        <div class="balance" id="user-balance">Баланс: 1000 ⭐</div>
        <div style="font-weight: bold;">UPGRADER</div>
    </header>

    <div class="upgrader-container">
        <div class="needle"></div>
        <div class="wheel" id="wheel">
            <div class="wheel-inner">
                <div class="chance-text" id="chance-display">0%</div>
                <div class="chance-label">Шанс</div>
            </div>
        </div>
    </div>

    <div class="items-row">
        <div class="item-box" onclick="openModal('source')">
            <span style="color: var(--gray); text-align: center; font-size: 14px;">Обрати свій<br>подарунок</span>
            <b id="source-val" style="color: var(--yellow); margin-top: 10px;">0 ⭐</b>
        </div>
        <div class="item-box" onclick="openModal('target')">
            <span style="color: var(--gray); text-align: center; font-size: 14px;">Обрати цільовий<br>подарунок</span>
            <b id="target-val" style="color: var(--yellow); margin-top: 10px;">0 ⭐</b>
        </div>
    </div>

    <button class="btn" id="upgrade-btn" onclick="startUpgrade()" disabled>Покращити</button>

    <!-- Модальне вікно з подарками -->
    <div class="modal" id="gift-modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Оберіть подарок</h3>
            <!-- Список подарків згенерується через JS -->
            <div id="gift-list"></div>
            <button class="btn" style="width: 100%; margin: 20px 0 0 0; background: #333; color: #fff;" onclick="closeModal()">Закрити</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let sourceValue = 0;
        let targetValue = 0;
        let currentSelectionType = null;

        // Каталог подарків (як в апгрейдері)
        const gifts = [
            { name: "Сердечко ❤️", price: 15 },
            { name: "Ведмедик 🧸", price: 25 },
            { name: "Торт 🎂", price: 50 },
            { name: "Букет 💐", price: 50 },
            { name: "Ракета 🚀", price: 50 },
            { name: "Кубок 🏆", price: 100 },
            { name: "Кільце 💍", price: 100 },
            { name: "Діамант 💎", price: 250 }
        ];

        function openModal(type) {
            currentSelectionType = type;
            const list = document.getElementById('gift-list');
            list.innerHTML = '';
            
            gifts.forEach(gift => {
                let div = document.createElement('div');
                div.className = 'gift-item';
                div.innerHTML = `<span>${gift.name}</span> <b style="color:var(--yellow)">${gift.price} ⭐</b>`;
                div.onclick = () => selectGift(gift.price);
                list.appendChild(div);
            });

            document.getElementById('gift-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('gift-modal').style.display = 'none';
        }

        function selectGift(price) {
            if (currentSelectionType === 'source') {
                sourceValue = price;
                document.getElementById('source-val').innerText = price + ' ⭐';
            } else {
                targetValue = price;
                document.getElementById('target-val').innerText = price + ' ⭐';
            }
            closeModal();
            calculateChance();
        }

        function calculateChance() {
            if (sourceValue > 0 && targetValue > 0) {
                // РОЗРАХУНОК ШАНСУ: (Твій / Цільовий) * 0.9 (комісія 10%)
                let chance = (sourceValue / targetValue) * 0.9 * 100;
                if (chance > 90) chance = 90; // Максимальний шанс 90%
                
                document.getElementById('chance-display').innerText = chance.toFixed(1) + '%';
                
                // Оновлення круга
                document.getElementById('wheel').style.background = `conic-gradient(
                    #ffcc00 0deg, #ffcc00 ${chance * 3.6}deg, 
                    #333 ${chance * 3.6}deg, #333 360deg
                )`;

                document.getElementById('upgrade-btn').disabled = false;
            }
        }

        function startUpgrade() {
            const btn = document.getElementById('upgrade-btn');
            btn.disabled = true;
            btn.innerText = "Крутиться...";

            // Анімація
            const wheel = document.getElementById('wheel');
            const randomDeg = Math.floor(Math.random() * 360) + 1080; 
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            // Відправляємо дані боту
            tg.sendData(JSON.stringify({
                action: "upgrade",
                source: sourceValue,
                target: targetValue
            }));

            setTimeout(() => {
                tg.close();
            }, 3000);
        }
    </script>
</body>
</html>
